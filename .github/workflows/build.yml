name: Build KFOverlay

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'kfun.ipa'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate into kfun.ipa
        run: |
          unzip -o kfun.ipa -d work_dir
          APP_DIR=$(find work_dir -name "*.app" -type d | head -1)
          
          cp index.html "$APP_DIR/index.html"
          
          echo "=== index.html replaced ==="
          ls -la "$APP_DIR/index.html"
          
          cd work_dir
          zip -r ../kfun_with_overlay.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kfun_with_overlay
          path: kfun_with_overlay.ipa
          retention-days: 7
