name: Build KFOverlay

on:
  workflow_dispatch:
  push:
    paths:
      - 'KFOverlay_integrated.m'
      - 'kfun.ipa'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile KFOverlay.dylib
        run: |
          xcrun --sdk iphoneos --find clang \
            -fPIC -shared -fobjc-arc -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -lobjc -lSystem -O2 \
            -o KFOverlay.dylib KFOverlay_integrated.m

      - name: Integrate into kfun.ipa
        run: |
          unzip -o kfun.ipa -d work_dir
          APP_DIR=$(find work_dir -name "*.app" -type d | head -1)
          
          mkdir -p "$APP_DIR/Frameworks"
          cp KFOverlay.dylib "$APP_DIR/Frameworks/"
          
          BINARY="$APP_DIR/kfun"
          
          python3 << 'PYEOF'
import struct, os

binary_path = os.environ['BINARY']
with open(binary_path, 'rb') as f:
    data = bytearray(f.read())

magic = struct.unpack_from('<I', data, 0)[0]
if magic == 0xFEEDFACF:
    header_size = 32
    ncmds = struct.unpack_from('<I', data, 16)[0]
    sizeofcmds = struct.unpack_from('<I', data, 20)[0]
    
    dylib_name = "@executable_path/Frameworks/KFOverlay.dylib"
    name_len = len(dylib_name) + 1
    load_dylib_size = 24 + 16 + name_len
    if load_dylib_size % 8 != 0:
        load_dylib_size += 8 - (load_dylib_size % 8)
    
    new_sizeofcmds = sizeofcmds + load_dylib_size
    new_ncmds = ncmds + 1
    
    new_cmd = struct.pack('<II', 0x18, load_dylib_size)
    new_cmd += struct.pack('<IIII', 0x00000801, 0, name_len, 0)
    new_cmd += dylib_name.encode('ascii') + b'\x00'
    pad_len = load_dylib_size - len(new_cmd)
    new_cmd += b'\x00' * pad_len
    
    offset = header_size
    for i in range(ncmds):
        cmd_size = struct.unpack_from('<I', data, offset + 4)[0]
        offset += cmd_size
    
    data[offset:offset] = new_cmd
    struct.pack_into('<I', data, 16, new_ncmds)
    struct.pack_into('<I', data, 20, new_sizeofcmds)
    
    with open(binary_path, 'wb') as f:
        f.write(data)
    print("LC_LOAD_DYLIB added successfully")
PYEOF
          
          touch "$APP_DIR/.troll-fools"
          
          cd work_dir
          zip -r ../kfun_with_overlay.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kfun_with_overlay
          path: kfun_with_overlay.ipa
          retention-days: 7
