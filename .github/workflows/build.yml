name: Build KFOverlay

on:
  workflow_dispatch:
  push:
    paths:
      - 'KFOverlay_integrated.m'
      - 'inject.py'
      - 'kfun.ipa'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile KFOverlay.dylib
        run: |
          xcrun --sdk iphoneos clang \
            -fPIC -shared -fobjc-arc -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -lobjc -lSystem -O2 \
            -o KFOverlay.dylib KFOverlay_integrated.m

      - name: Integrate into kfun.ipa
        run: |
          # Unzip IPA
          unzip -o kfun.ipa -d work_dir
          APP_DIR=$(find work_dir -name "*.app" -type d | head -1)
          
          # Copy dylib to Frameworks
          mkdir -p "$APP_DIR/Frameworks"
          cp KFOverlay.dylib "$APP_DIR/Frameworks/"
          
          # Add LC_LOAD_DYLIB to kfun binary
          BINARY="$APP_DIR/kfun"
          DYLIB="@executable_path/Frameworks/KFOverlay.dylib"
          
          python3 inject.py "$BINARY" "$DYLIB"
          
          # Create TrollFools marker (optional, for compatibility)
          touch "$APP_DIR/.troll-fools"
          
          # Verify the injection
          echo "=== Verify Mach-O ==="
          file "$BINARY"
          echo "=== Check for LC_LOAD_DYLIB ==="
          otool -L "$BINARY" 2>/dev/null || true
          
          # Repackage IPA
          cd work_dir
          zip -r ../kfun_with_overlay.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kfun_with_overlay
          path: kfun_with_overlay.ipa
          retention-days: 7
