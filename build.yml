name: Build KFOverlay

on:
  workflow_dispatch:  # 手动触发
  push:
    paths:
      - 'KFOverlay_integrated.m'
      - 'kfun.ipa'

jobs:
  build:
    runs-on: macos-latest  # GitHub 免费提供 macOS runner
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install optool
        run: |
          brew install optool || true

      - name: Compile KFOverlay.dylib
        run: |
          xcrun --sdk iphoneos --find clang \
            -fPIC -shared -fobjc-arc -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -lobjc -lSystem -O2 \
            -o KFOverlay.dylib KFOverlay_integrated.m

      - name: Install insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          make
          cp insert_dylib /usr/local/bin/

      - name: Integrate into kfun.ipa
        run: |
          # 解包 IPA
          unzip -o kfun.ipa -d work_dir
          APP_DIR=$(find work_dir -name "*.app" -type d | head -1)

          # 复制 dylib
          mkdir -p "$APP_DIR/Frameworks"
          cp KFOverlay.dylib "$APP_DIR/Frameworks/"

          # 添加 LC_LOAD_DYLIB
          BINARY="$APP_DIR/kfun"
          insert_dylib --inplace --weak \
            "@executable_path/Frameworks/KFOverlay.dylib" \
            "$BINARY"

          # 创建 TrollFools 标记
          touch "$APP_DIR/.troll-fools"

          # 重新打包
          cd work_dir
          zip -r ../kfun_with_overlay.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kfun_with_overlay
          path: kfun_with_overlay.ipa
          retention-days: 7
